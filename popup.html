<!-- Popup document for the TV Tracker Chrome extension. -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TV Tracker</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app">
            <!-- ── Header ─────────────────────────────────────────── -->
            <header class="app-header">
                <h1 class="app-title">TV Tracker</h1>
                <button class="btn btn-primary" type="button" id="btn-add-show">
                    <svg viewBox="0 0 20 20" aria-hidden="true">
                        <path
                            d="M10 3v14M3 10h14"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>
                    Add show
                </button>
            </header>

            <!-- ── Search panel (hidden by default) ──────────────── -->
            <section
                class="search-panel"
                id="search-panel"
                hidden
                aria-label="Add a show"
            >
                <div class="search-bar">
                    <input
                        class="search-input"
                        type="search"
                        id="search-input"
                        placeholder="Search for a show…"
                        autocomplete="off"
                        aria-label="Show title"
                    />
                    <button
                        class="btn btn-ghost"
                        type="button"
                        id="btn-search-cancel"
                    >
                        Cancel
                    </button>
                </div>
                <ul
                    class="search-results"
                    id="search-results"
                    aria-label="Search results"
                ></ul>
            </section>

            <!-- ── Sort control ───────────────────────────────────── -->
            <div class="sort-bar" id="sort-bar" hidden>
                <label class="sort-label" for="sort-select">Sort by</label>
                <select class="sort-select" id="sort-select">
                    <option value="title-asc">Title (A–Z)</option>
                    <option value="title-desc">Title (Z–A)</option>
                    <option value="airdate-asc">Air date (soonest first)</option>
                    <option value="airdate-desc">Air date (latest first)</option>
                </select>
            </div>

            <!-- ── Show sections (populated from storage) ─────────── -->
            <main
                class="show-sections"
                id="show-sections"
                aria-label="Tracked shows"
                hidden
            >
                <!-- Shown when no shows are tracked. -->
                <p class="empty-state" id="empty-state" hidden>
                    No shows tracked yet. Use &ldquo;Add show&rdquo; above to
                    get started.
                </p>
            </main>

            <!-- ── Footer ─────────────────────────────────────────── -->
            <footer class="app-footer">
                <span id="last-updated"></span>
                <div class="footer-actions">
                    <button
                        class="btn-icon"
                        type="button"
                        id="btn-export"
                        aria-label="Export tracked shows as a JSON file"
                    >
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path
                                d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M4 14v2a1 1 0 001 1h10a1 1 0 001-1v-2"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                    </button>
                    <button
                        class="btn-icon"
                        type="button"
                        id="btn-import"
                        aria-label="Import tracked shows from a JSON file"
                    >
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path
                                d="M10 12V3m0 0l-3.5 3.5M10 3l3.5 3.5"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M4 14v2a1 1 0 001 1h10a1 1 0 001-1v-2"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                    </button>
                    <input
                        type="file"
                        id="import-file"
                        accept="application/json"
                        hidden
                    />
                    <button class="btn btn-ghost" type="button" id="btn-refresh">
                        <svg viewBox="0 0 20 20" aria-hidden="true">
                            <path
                                d="M16 10a6 6 0 11-1.8-4.3M16 3v4h-4"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        Refresh
                    </button>
                </div>
            </footer>
        </div>

        <script type="module" src="/src/popup/main.ts"></script>
    </body>
</html>
